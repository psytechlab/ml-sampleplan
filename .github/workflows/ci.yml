name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --without paper

      - name: Check formatting
        run: poetry run make check

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --without paper --extras web

      - name: Run tests
        run: poetry run python -m pytest tests

      - name: Check that the CLI is installed as an executable
        run: |
          poetry run sampleplan --help
          poetry run sampleplan ci -d binomial --p0 0.01 --alpha 0.05 --ci-half-width 0.01
          poetry run sampleplan single -d binomial --p-a 0.01 --p-r 0.05

      - name: Smoke test the web server
        run: |
          poetry run sampleplan-web > /tmp/sampleplan-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/api/health || {
            cat /tmp/sampleplan-web.log
            exit 1
          }
          curl --fail http://127.0.0.1:8000/api/single \
            -H 'content-type: application/json' \
            -d '{"distribution":"binomial","p_a":0.01,"p_r":0.05}' || {
            cat /tmp/sampleplan-web.log
            exit 1
          }
