[tool.poetry]
name = "sampleplan"
version = "0.3.0"
description = ""
authors = ["Jan-Christoph Klie <jklie@apple.com>"]
license = "Apple Sample Code License"
readme = "README.md"

[tool.poetry.scripts]
sampleplan = "sampleplan.cli.main:main"
sampleplan-web = "sampleplan.web.__main__:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
scipy = ">=1.0.0"
numpy = "^2.2.3"
fastapi = {version = "^0.115", optional = true}
uvicorn = {version = "^0.32", extras = ["standard"], optional = true}

[tool.poetry.extras]
web = ["fastapi", "uvicorn"]

[tool.poetry.group.paper.dependencies]
matplotlib = "^3.9.0"
seaborn = "^0.13.2"
diskcache = "^5.6.3"
tabulate = "^0.9.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
black = "^24.4.2"
isort = "^5.13.2"
tqdm = "^4.66.4"
httpx = "^0.28"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
